<body>
<p>Einen Moment …</p>
<script>
(function () {
  function kurzcode(slug) {
    let h = 5381;
    for (let i = 0; i < slug.length; i++) h = ((h * 33) ^ slug.charCodeAt(i)) >>> 0;
    return h.toString(36);
  }
  const q = new URLSearchParams(location.search);
  const k = q.get('k');
  const slug = Object.keys(window.RAETSEL_DATEN || {}).find(s => kurzcode(s) === k);
  location.replace(slug ? slug + '.html?raetsel' + (q.has('tdt') ? '&tdt' : '') : 'index.html');
})();
</script>
